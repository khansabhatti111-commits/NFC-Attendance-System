<!DOCTYPE html>
<html>

<head>

    <title>Student Registered</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Student Registered Successfully!</h1>

    <hr>

    <h3>Student Information</h3>

    </a>

    <br><br>

    <a href="/dashboard">
        <button>Go to Dashboard</button>
    </a>

</div>

</body>

</html>
