<!DOCTYPE html>
<html>

<head>
    <title>Attendance Records</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Attendance Records</h1>

<hr>

<form method="GET" action="/attendance">

    <label>Search Attendance:</label>

   

    <input
        type="text"
        name="search"
        placeholder="Search by Student ID, name, or course"
        value="{{ search }}"
    >

    <br><br>

    <label>Attendance Date:</label>

    <input
        type="date"
        name="date"
        value="{{ selected_date }}"
    >

    <br><br>

    <button type="submit">Search</button>

</form> 

<br>

<table>
        <tr>
            <th>ID</th>
            <th>Student ID</th>
            <th>Student Name</th>
            <th>Course</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
        </tr>

        {% for record in records %}

        <tr>
            <td>{{ record.attendance_id }}</td>
            <td>{{ record.student_id }}</td>
            <td>{{ record.student_name }}</td>
            <td>{{ record.course_code }}</td>
            <td>{{ record.attendance_date }}</td>
            <td>{{ record.attendance_time }}</td>
            <td>{{ record.status }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">
        <button>Mark New Attendance</button>
    </a>

</div>

</body>

</html>
